# The ticker Worker (see index.js). Deployed by .github/workflows/ticker.yml, not part of the Pages site.
name = "connecthor-ticker"
main = "index.js"
compatibility_date = "2026-11-01"
workers_dev = false

# one trigger (the free plan allows 5 per account, shared with other Workers), at :05 and :25 (UTC).
# :05: the tools that are due (index.js); every 3 hours at :25: aggregaTHOR's update (at 06:25 also its daily research run)
[triggers]
crons = ["5,25 * * * *"]
