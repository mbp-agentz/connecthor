# Heimdall: official travel warnings (US, DE, UK) and Wikipedia attention per country, every 3 hours.
# tools/heimdall.mjs writes heimdall.json, force-pushed as the only file on the orphan branch
# heimdall-data. The page reads it from raw.githubusercontent.com, so visitors cost no Pages Function calls.
name: Heimdall data

on:
  workflow_dispatch:
  schedule:
    - cron: '51 */3 * * *'

permissions:
  contents: write

concurrency:
  group: heimdall
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The previous file tells which advisory levels were raised since the last run
      - name: Read travel warnings and Wikipedia attention
        run: node tools/heimdall.mjs "$RUNNER_TEMP/heimdall/heimdall.json" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/heimdall-data/heimdall.json"

      - name: Publish to the heimdall-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/heimdall"
          git init -q -b heimdall-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heimdall.json
          git commit -q -m "Heimdall data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" heimdall-data
